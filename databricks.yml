bundle:
  name: my-databricks-project

variables:
  catalog:
    description: Unity Catalog catalog for pipeline tables
    default: demo
  schema:
    description: Unity Catalog schema for pipeline tables
    default: medallion_dev
  source_path:
    description: Unity Catalog Volume path containing incoming sales-event JSON files
    default: /Volumes/demo/feed/feed
  schema_location:
    description: Writable Unity Catalog Volume path for Auto Loader schema state
    default: /Volumes/demo/feed/feed/_autoloader/sales_events_dev

include:
  - databricks/resources/*.yml

targets:
  dev:
    mode: development
    default: true
    variables:
      schema: medallion_dev

  prod:
    mode: production
    variables:
      schema: medallion_prod
      schema_location: /Volumes/demo/feed/feed/_autoloader/sales_events_prod
    resources:
      pipelines:
        medallion_pipeline:
          development: false
