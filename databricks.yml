bundle:
  name: my-databricks-project

variables:
  environment:
    description: Deployment environment
    default: dev

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    variables:
      environment: dev
    workspace:
      #root_path: /Workspace/Users/${workspace.current_user.user_name}/.bundle/${bundle.name}/${bundle.target}
        host: https://dbc-16325a15-87c0.cloud.databricks.com

  prod:
    mode: production
    variables:
      environment: prod
    workspace:
      #root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
       host:  https://dbc-16325a15-87c0.cloud.databricks.com
