name: Deploy Databricks Asset Bundle

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

concurrency:
  group: databricks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest -q

  deploy-dev:
    name: Deploy to development
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'dev')
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_DEV || 'https://dbc-16325a15-87c0.cloud.databricks.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check Databricks authentication configuration
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::error::DATABRICKS_HOST_DEV is empty. Set it to the development workspace URL in GitHub Actions variables."
            exit 1
          fi
          case "$DATABRICKS_HOST" in
            https://*) ;;
            *)
              echo "::error::DATABRICKS_HOST_DEV must be a full https:// workspace URL."
              exit 1
              ;;
          esac
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::error::DATABRICKS_TOKEN is empty or unavailable to this workflow."
            exit 1
          fi

      - name: Validate and deploy development bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate --target dev
          databricks bundle deploy --target dev
          databricks bundle run medallion_pipeline --target dev

  deploy-prod:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod'
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_PROD || 'https://dbc-16325a15-87c0.cloud.databricks.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check Databricks authentication configuration
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::error::DATABRICKS_HOST_PROD is empty. Set it to the production workspace URL in GitHub Actions variables."
            exit 1
          fi
          case "$DATABRICKS_HOST" in
            https://*) ;;
            *)
              echo "::error::DATABRICKS_HOST_PROD must be a full https:// workspace URL."
              exit 1
              ;;
          esac
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::error::DATABRICKS_TOKEN is empty or unavailable to this workflow."
            exit 1
          fi

      - name: Validate and deploy production bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate --target prod
          databricks bundle deploy --target prod
          databricks bundle run medallion_pipeline --target prod
