resources:
  jobs:
    sample_job:
      name: "${bundle.name}-${var.environment}-sample-job"
      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ${workspace.file_path}/src/notebooks/sample
            base_parameters:
              environment: ${var.environment}
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
