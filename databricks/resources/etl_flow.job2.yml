resources:
  jobs:
    etl_flow_2:
      name: etl_flow_2
      description: Landing -> Feed -> STG -> Datamart secondary chain for the configured entity.
      max_concurrent_runs: 1

      tasks:
        - task_key: init_catalog_schema
          notebook_task:
            notebook_path: ../../src/etl/InitCatalogSchema.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: landing
            source: WORKSPACE
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: landing_to_feed
          depends_on:
            - task_key: init_catalog_schema
          notebook_task:
            notebook_path: ../../src/etl/LandingtoFeed.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              landing_path: ${var.landing_path}
              entity: ${var.entity}
              run_date: "{{job.start_time.iso_date}}"
            source: WORKSPACE
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: feed_to_stg
          depends_on:
            - task_key: landing_to_feed
          notebook_task:
            notebook_path: ../../src/etl/FeedtoSTG.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              entity: ${var.entity}
              business_key: ${var.business_key}
              run_date: "{{job.start_time.iso_date}}"
            source: WORKSPACE
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: stg_to_datamart
          depends_on:
            - task_key: feed_to_stg
          notebook_task:
            notebook_path: ../../src/etl/STGtoDatamart.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              entity: ${var.entity}
              business_key: ${var.business_key}
              run_date: "{{job.start_time.iso_date}}"
            source: WORKSPACE
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 60000
