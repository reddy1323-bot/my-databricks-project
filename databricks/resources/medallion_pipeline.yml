resources:
  pipelines:
    medallion_pipeline:
      name: ${bundle.name}-${bundle.target}-medallion
      catalog: ${var.catalog}
      target: ${var.schema}
      serverless: true
      development: true
      continuous: false
      channel: CURRENT
      edition: ADVANCED
      libraries:
        - notebook:
            path: ../../src/pipelines/medallion_pipeline.py
      configuration:
        pipeline.source_path: ${var.source_path}
        pipeline.schema_location: ${var.schema_location}
